# ASTRA-supported Cellpose runtime tests.
# ASTRA installs this fork by Git tag, so this workflow does not publish to PyPI.
# The supported runtime is Python 3.10 only; macOS is opt-in because the full
# upstream-style macOS test run is much slower than the ASTRA release gate.

name: tests

on:
  push:
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      include_macos:
        description: "Also run the slow macOS Python 3.10 tox job"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v6

      - name: Verify supported Python metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'python_requires=">=3.10,<3.11"' setup.py

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox tox-gh-actions
      # this runs the platform-specific tests declared in tox.ini
      - name: Test with tox
        run: tox
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Coverage
        uses: codecov/codecov-action@v6

  manual_macos:
    name: macos-latest py3.10
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_macos == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - name: Verify supported Python metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'python_requires=">=3.10,<3.11"' setup.py

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox tox-gh-actions

      - name: Test with tox
        run: tox
        env:
          PLATFORM: macos-latest

      - name: Coverage
        uses: codecov/codecov-action@v6
