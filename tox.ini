# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py310-{linux,macos,windows}

[gh-actions]
python =
    3.10: py310
fail_on_no_env = True

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY,XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
    USERNAME
    USER
    LOGNAME
    LNAME
    TEMP
    TMP
    TMPDIR
    TORCHINDUCTOR_CACHE_DIR
setenv =
    windows: TORCHINDUCTOR_CACHE_DIR = {env:TEMP}{/}torchinductor
    macos:   TORCHINDUCTOR_CACHE_DIR = {env:TMPDIR}{/}torchinductor
    linux:   TORCHINDUCTOR_CACHE_DIR = {env:TMPDIR:/tmp}{/}torchinductor
extras = gui
deps =
    .[gui]
    py
    pytest
    pytest-cov
    pytest-xvfb
# ignoring contrib tests for now
commands =
    #linux: apt-get update && apt-get install libgl1
    pytest -vv -rA --color=yes --cov=cellpose --cov-report=xml --ignore=tests/contrib --durations=0
